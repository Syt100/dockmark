name: Format PR 33

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - ".github/workflows/format-pr-33.yml"
      - "apps/**"
      - "packages/**"

permissions:
  contents: write

jobs:
  format:
    if: >-
      github.event.pull_request.number == 33 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Format changed implementation files
        run: >-
          corepack pnpm exec prettier --write
          apps/web/src/api/client.ts
          apps/web/src/components/ServiceIconEditor.vue
          apps/web/src/ui/serviceIconDiscovery.ts
          apps/worker/src/services/portable-import-export.ts
          apps/worker/src/services/service-icons.ts
          apps/worker/test/service-icons.test.ts
          packages/shared/src/import-export-assets.ts
          packages/shared/src/service-icons.ts

      - name: Commit formatting when needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps packages
          git commit -m "style: format automatic icon implementation"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
