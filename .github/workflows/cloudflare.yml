name: Cloudflare

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate
          corepack pnpm --version

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Validate workspace
        run: corepack pnpm validate

      - name: Check Cloudflare generated types
        run: corepack pnpm --filter @dockmark/worker cf-typecheck

      - name: Validate Cloudflare deploy dry run
        run: corepack pnpm deploy:dry-run

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment: production
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate
          corepack pnpm --version

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Validate workspace
        run: corepack pnpm validate

      - name: Check Cloudflare generated types
        run: corepack pnpm --filter @dockmark/worker cf-typecheck

      - name: Prepare deployment secrets
        working-directory: apps/worker
        run: |
          if [ -z "$DOCKMARK_SETUP_TOKEN" ]; then
            echo "::error::DOCKMARK_SETUP_TOKEN is required"
            exit 1
          fi
          node scripts/write-worker-secrets.mjs "$RUNNER_TEMP/worker-secrets.json"
        env:
          DOCKMARK_SETUP_TOKEN: ${{ secrets.DOCKMARK_SETUP_TOKEN }}

      - name: Ensure production D1 exists
        working-directory: apps/worker
        run: |
          corepack pnpm exec wrangler d1 list --json > "$RUNNER_TEMP/d1-list.json"
          if node scripts/d1-exists.mjs "$RUNNER_TEMP/d1-list.json" dockmark-production; then
            echo "D1 database dockmark-production already exists."
          else
            echo "Creating D1 database dockmark-production."
            corepack pnpm exec wrangler d1 create dockmark-production
            corepack pnpm exec wrangler d1 list --json > "$RUNNER_TEMP/d1-list.json"
          fi
          node scripts/write-d1-migration-config.mjs "$RUNNER_TEMP/d1-list.json" "$RUNNER_TEMP/wrangler.d1.generated.jsonc"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations
        working-directory: apps/worker
        run: corepack pnpm exec wrangler d1 migrations apply DB --remote --config "$RUNNER_TEMP/wrangler.d1.generated.jsonc"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: corepack pnpm --filter @dockmark/worker run deploy -- --secrets-file "$RUNNER_TEMP/worker-secrets.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
