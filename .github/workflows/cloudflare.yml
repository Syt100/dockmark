name: Cloudflare

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    paths:
      - ".github/workflows/cloudflare.yml"
      - "apps/**"
      - "packages/**"
      - "migrations/**"
      - "seeds/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cloudflare.yml"
      - "apps/**"
      - "packages/**"
      - "migrations/**"
      - "seeds/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
  workflow_dispatch:

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate
          corepack pnpm --version

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Validate workspace
        run: corepack pnpm validate

      - name: Check Cloudflare generated types
        run: corepack pnpm --filter @dockmark/worker cf-typecheck

      - name: Validate Cloudflare deploy dry run
        run: corepack pnpm deploy:dry-run

  preview:
    name: Preview
    runs-on: ubuntu-latest
    needs: validate
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: cloudflare-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      PREVIEW_D1_DATABASE_NAME: dockmark-preview-pr-${{ github.event.pull_request.number }}
      PREVIEW_KV_NAMESPACE_NAME: dockmark-preview
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate
          corepack pnpm --version

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build preview assets
        run: corepack pnpm build

      - name: Ensure preview D1 and KV exist
        working-directory: apps/worker
        run: |
          corepack pnpm exec wrangler d1 list --json > "$RUNNER_TEMP/d1-list.json"
          if node scripts/d1-exists.mjs "$RUNNER_TEMP/d1-list.json" "$PREVIEW_D1_DATABASE_NAME"; then
            echo "D1 database $PREVIEW_D1_DATABASE_NAME already exists."
          else
            echo "Creating D1 database $PREVIEW_D1_DATABASE_NAME."
            corepack pnpm exec wrangler d1 create "$PREVIEW_D1_DATABASE_NAME"
            corepack pnpm exec wrangler d1 list --json > "$RUNNER_TEMP/d1-list.json"
          fi

          corepack pnpm exec wrangler kv namespace list > "$RUNNER_TEMP/kv-list.json"
          if node -e "const fs=require('fs'); const xs=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); const name=process.argv[2]; process.exit(xs.some(x => x.title === name || x.name === name) ? 0 : 1)" "$RUNNER_TEMP/kv-list.json" "$PREVIEW_KV_NAMESPACE_NAME"; then
            echo "KV namespace $PREVIEW_KV_NAMESPACE_NAME already exists."
          else
            echo "Creating KV namespace $PREVIEW_KV_NAMESPACE_NAME."
            corepack pnpm exec wrangler kv namespace create "$PREVIEW_KV_NAMESPACE_NAME"
            corepack pnpm exec wrangler kv namespace list > "$RUNNER_TEMP/kv-list.json"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Generate preview Wrangler config
        working-directory: apps/worker
        run: |
          PR_HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          PREVIEW_APP_VERSION="pr-${{ github.event.pull_request.number }}-${PR_HEAD_SHA::7}" \
            node scripts/write-preview-config.mjs \
              "$RUNNER_TEMP/d1-list.json" \
              "$RUNNER_TEMP/kv-list.json" \
              wrangler.preview.generated.jsonc

      - name: Apply preview D1 migrations
        working-directory: apps/worker
        run: corepack pnpm exec wrangler d1 migrations apply DB --remote --config wrangler.preview.generated.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Seed preview demo data
        working-directory: apps/worker
        run: |
          sed '/^BEGIN TRANSACTION;$/d; /^COMMIT;$/d' ../../seeds/local-dev.sql > "$RUNNER_TEMP/preview-seed.sql"
          corepack pnpm exec wrangler d1 execute DB --remote --config wrangler.preview.generated.jsonc --file "$RUNNER_TEMP/preview-seed.sql"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload preview Worker version
        id: upload-preview
        working-directory: apps/worker
        run: |
          set +e
          upload_output="$(corepack pnpm exec wrangler versions upload \
            --config wrangler.preview.generated.jsonc \
            --minify \
            --preview-alias "pr-${{ github.event.pull_request.number }}" 2>&1)"
          upload_status=$?
          set -e

          printf '%s\n' "$upload_output"
          if [ "$upload_status" -ne 0 ]; then
            exit "$upload_status"
          fi

          preview_url="$(printf '%s\n' "$upload_output" | grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' | tail -n 1)"
          if [ -z "$preview_url" ]; then
            echo "::error::Wrangler upload succeeded but no Preview URL was found in its output."
            exit 1
          fi

          echo "url=$preview_url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment preview link on pull request
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.upload-preview.outputs.url }}
        with:
          script: |
            const marker = '<!-- dockmark-pr-preview -->'
            const shortSha = context.payload.pull_request.head.sha.slice(0, 7)
            const body = `${marker}\n## Cloudflare Preview ✅\n\n🌐 **Preview:** ${process.env.PREVIEW_URL}\n\nPR head: \`${shortSha}\`\n\nThis preview uses isolated D1 \`${process.env.PREVIEW_D1_DATABASE_NAME}\` and shared non-production KV with demo data.`
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            })
            const existing = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker),
            )

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }

  cleanup-preview:
    name: Cleanup preview D1
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: cloudflare-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      PREVIEW_D1_DATABASE_NAME: dockmark-preview-pr-${{ github.event.pull_request.number }}
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate
          corepack pnpm --version

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Delete pull request D1
        working-directory: apps/worker
        run: |
          corepack pnpm exec wrangler d1 list --json > "$RUNNER_TEMP/d1-list.json"
          if node scripts/d1-exists.mjs "$RUNNER_TEMP/d1-list.json" "$PREVIEW_D1_DATABASE_NAME"; then
            echo "Deleting D1 database $PREVIEW_D1_DATABASE_NAME."
            corepack pnpm exec wrangler d1 delete "$PREVIEW_D1_DATABASE_NAME" --skip-confirmation
          else
            echo "D1 database $PREVIEW_D1_DATABASE_NAME is already absent."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment: production
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate
          corepack pnpm --version

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Validate workspace
        run: corepack pnpm validate

      - name: Check Cloudflare generated types
        run: corepack pnpm --filter @dockmark/worker cf-typecheck

      - name: Prepare deployment secrets
        working-directory: apps/worker
        run: |
          if [ -z "$DOCKMARK_SETUP_TOKEN" ]; then
            echo "::error::DOCKMARK_SETUP_TOKEN is required"
            exit 1
          fi
          node scripts/write-worker-secrets.mjs "$RUNNER_TEMP/worker-secrets.json"
        env:
          DOCKMARK_SETUP_TOKEN: ${{ secrets.DOCKMARK_SETUP_TOKEN }}

      - name: Ensure production D1 exists
        working-directory: apps/worker
        run: |
          corepack pnpm exec wrangler d1 list --json > "$RUNNER_TEMP/d1-list.json"
          if node scripts/d1-exists.mjs "$RUNNER_TEMP/d1-list.json" dockmark-production; then
            echo "D1 database dockmark-production already exists."
          else
            echo "Creating D1 database dockmark-production."
            corepack pnpm exec wrangler d1 create dockmark-production
            corepack pnpm exec wrangler d1 list --json > "$RUNNER_TEMP/d1-list.json"
          fi
          node scripts/write-d1-migration-config.mjs "$RUNNER_TEMP/d1-list.json" wrangler.d1.generated.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations
        working-directory: apps/worker
        run: corepack pnpm exec wrangler d1 migrations apply DB --remote --config wrangler.d1.generated.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        working-directory: apps/worker
        run: corepack pnpm exec wrangler deploy --env production --minify --secrets-file "$RUNNER_TEMP/worker-secrets.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
